name: tts-lab
on:
  push:
    branches: [tts-lab]
    paths: ['lab/*.py', 'lab/texts.json', '.github/workflows/tts-lab.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pocket:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -q pocket-tts soundfile huggingface_hub --extra-index-url https://download.pytorch.org/whl/cpu
      - run: cd lab && python pocket_lab.py
      - uses: actions/upload-artifact@v4
        with: { name: pocket, path: lab/out/*.mp3, if-no-files-found: warn }
  chatterbox:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -q chatterbox-tts soundfile huggingface_hub --extra-index-url https://download.pytorch.org/whl/cpu
      - run: cd lab && python chatter_lab.py
      - uses: actions/upload-artifact@v4
        with: { name: chatterbox, path: lab/out/*.mp3, if-no-files-found: warn }
  collect:
    needs: [pocket, chatterbox]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - uses: actions/download-artifact@v4
        with: { path: lab/out, merge-multiple: true }
      - run: pip install -q faster-whisper soundfile
      - run: cd lab && python check.py
      - run: |
          git config user.name "tts-lab"
          git config user.email "tts-lab@users.noreply.github.com"
          git add lab/out
          git commit -m "Зразки голосів" || echo nothing
          git push
